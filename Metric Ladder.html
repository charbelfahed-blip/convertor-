<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metric Ladder: mm, cm, dm, m</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef3f1;--ink:#14232b;--grid:#d2dedb;--teal:#0f766e;--mark:#f6d743;--card:#fbfdfc;--muted:#4d6068}
*{box-sizing:border-box}
body{margin:0;font-family:"Schibsted Grotesk",system-ui,sans-serif;color:var(--ink);background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;line-height:1.5}
main{max-width:820px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:0 0 10px}
a{color:var(--teal);font-weight:600}
.sub{margin:0 0 20px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button{font:inherit;padding:6px 12px;border:2px solid var(--ink);background:var(--card);border-radius:6px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:18px;margin-bottom:18px}
.row{display:grid;grid-template-columns:1fr 1fr auto 1fr;gap:10px;align-items:end}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input,select{font:inherit;width:100%;padding:10px;border:2px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink)}
#swap{font:inherit;font-size:1.3rem;padding:8px 12px;border:2px solid var(--ink);border-radius:6px;background:var(--mark);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.big{font-size:clamp(1.8rem,8vw,3.2rem);font-weight:800;line-height:1.15;overflow-wrap:anywhere;margin:0}
.big sup,.mult sup{font-size:.6em}
.mult{margin:8px 0 0;font-size:1.15rem}
.mult b{background:var(--mark);padding:0 .3em;border-radius:4px}
.how{margin:8px 0 0;color:var(--muted)}
.err{color:#a11d33;font-weight:600}
.wrap{overflow-x:auto;margin-top:16px;padding-bottom:6px}
table{border-collapse:collapse;margin:0 auto;background:#fff}
th{padding:6px 4px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:600}
th.f{background:var(--teal)} th.t{background:var(--mark);color:var(--ink)}
td{position:relative;width:1.9rem;height:2.6rem;text-align:center;font-size:1.3rem;font-weight:800;border-bottom:2px solid var(--ink);border-top:2px solid var(--ink)}
td.g{border-left:2px solid var(--ink)}
td.last{border-right:2px solid var(--ink)}
td.pt{box-shadow:inset -5px 0 0 var(--mark)}
td.pf{border-right:3px solid var(--teal)}
td.pf::after{content:",";position:absolute;right:-.42em;bottom:-.15em;color:var(--teal);font-size:1.6rem;z-index:1}
.legend{margin:10px 0 0;font-size:.9rem;color:var(--muted);text-align:center}
sup{font-size:.7em}
@media(max-width:560px){.row{grid-template-columns:1fr 1fr}#swap{justify-self:start}}
</style>
</head>
<body>
<main>
<h1>Metric Ladder</h1>
<p class="sub">Move between km, hm, dam, m, dm, cm and mm by sliding the comma along the table. <a href="index.html">Full unit converter</a></p>

<div class="tabs" id="tabs" role="group" aria-label="Quantity"></div>

<section class="panel" aria-labelledby="h">
<h2 id="h">Convert</h2>
<div class="row">
<div><label for="val">Value</label><input id="val" type="text" inputmode="decimal" value="1250"></div>
<div><label for="from">From</label><select id="from"></select></div>
<button id="swap" aria-label="Swap units" title="Swap units">⇄</button>
<div><label for="to">To</label><select id="to"></select></div>
</div>
<div style="margin-top:18px" aria-live="polite">
<p class="big" id="out"></p>
<p class="mult" id="mult"></p>
<p class="how" id="how"></p>
</div>
<div class="wrap"><table id="tbl"></table></div>
<p class="legend">Teal line and comma: where your number starts. Yellow edge: where the comma ends up.</p>
</section>
</main>

<script>
const PRE = ["k","h","da","","d","c","m"];
const SUP = {2:"²",3:"³"};
const Q = {
  "Length":   { base:"m", n:1 },
  "Area":     { base:"m", n:2 },
  "Volume":   { base:"m", n:3 },
  "Mass":     { base:"g", n:1 },
  "Capacity": { base:"L", n:1 }
};
let cat = "Length";
const $ = id => document.getElementById(id);
const name = i => PRE[i] + Q[cat].base + (SUP[Q[cat].n] || "");
const html = i => PRE[i] + Q[cat].base + (Q[cat].n > 1 ? "<sup>" + Q[cat].n + "</sup>" : "");

// Move the decimal point of a digit string by k places (k>0 = to the right).
function shift(a, b, k){
  const d = a + b; const p = a.length + k;
  let s;
  if (p <= 0) s = "0." + "0".repeat(-p) + d;
  else if (p >= d.length) s = d + "0".repeat(p - d.length);
  else s = d.slice(0, p) + "." + d.slice(p);
  let [i, f = ""] = s.split(".");
  i = i.replace(/^0+(?=\d)/, ""); f = f.replace(/0+$/, "");
  return f ? i + "." + f : i;
}

function render(){
  const raw = $("val").value.trim().replace(",", ".");
  const i = $("from").selectedIndex, j = $("to").selectedIndex, n = Q[cat].n;
  if (!/^\d*\.?\d*$/.test(raw) || raw === "" || raw === "."){
    $("out").innerHTML = '<span class="err">Enter a positive number, for example 1250 or 3.6.</span>';
    $("mult").textContent = ""; $("how").textContent = ""; drawTable(i, j, "", ""); return;
  }
  let [a, b = ""] = raw.split("."); if (a === "") a = "0";
  const steps = j - i, k = n * steps;
  $("out").innerHTML = shift(a, b, k).replace(".", ",") + " " + html(j);
  if (steps === 0){
    $("mult").textContent = "Same unit: nothing to move.";
    $("how").textContent = "";
  } else {
    $("mult").innerHTML = "× 10<sup>" + k + "</sup> &nbsp;(" + (steps > 0 ? "multiply" : "divide") + " by 10<sup>" + Math.abs(k) + "</sup>)";
    const dir = steps > 0 ? "right" : "left";
    $("how").innerHTML = html(i) + " → " + html(j) + ": " + Math.abs(steps) + " column" + (Math.abs(steps) > 1 ? "s" : "") + " to the " + dir + ". Each column is × 10<sup>" + n + "</sup>, so the comma moves " + Math.abs(k) + " place" + (Math.abs(k) > 1 ? "s" : "") + " to the " + dir + ".";
  }
  drawTable(i, j, a, b);
}

function drawTable(i, j, a, b){
  const n = Q[cat].n, T = 7 * n, p0 = i * n + n - 1, pt = j * n + n - 1;
  const D = a + b, start = p0 - a.length + 1;
  const fits = a !== "" && start >= 0 && start + D.length <= T;
  let h = "<tr>";
  for (let c = 0; c < 7; c++) h += `<th colspan="${n}" class="${c === i ? "f" : c === j ? "t" : ""}">${html(c)}</th>`;
  h += "</tr><tr>";
  for (let c = 0; c < T; c++){
    const col = Math.floor(c / n);
    let cls = c % n === 0 ? "g" : "";
    if (c === T - 1) cls += " last";
    if (c === pt) cls += " pt";
    if (c === p0) cls += " pf";
    const v = fits ? (D[c - start] ?? "") : "";
    h += `<td class="${cls}">${v}</td>`;
  }
  $("tbl").innerHTML = h + "</tr>" + (a !== "" && !fits ? `<tr><td colspan="${T}" style="font-size:.85rem;font-weight:400;height:auto;padding:6px">This number is too long for the table. The result above is still correct.</td></tr>` : "");
}

function fillUnits(){
  const opts = PRE.map((p, i) => `<option>${name(i)}</option>`).join("");
  $("from").innerHTML = opts; $("to").innerHTML = opts;
  $("from").selectedIndex = 6; $("to").selectedIndex = 3;
}
function buildTabs(){
  $("tabs").innerHTML = "";
  Object.keys(Q).forEach(k => {
    const b = document.createElement("button");
    b.textContent = k; b.setAttribute("aria-pressed", k === cat);
    b.onclick = () => { cat = k; buildTabs(); fillUnits(); render(); };
    $("tabs").appendChild(b);
  });
}
$("val").addEventListener("input", render);
$("from").addEventListener("change", render);
$("to").addEventListener("change", render);
$("swap").addEventListener("click", () => { const f = $("from").selectedIndex; $("from").selectedIndex = $("to").selectedIndex; $("to").selectedIndex = f; render(); });
buildTabs(); fillUnits(); render();
</script>
</body>
</html>
